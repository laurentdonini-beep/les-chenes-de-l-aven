spring.application.name=les-chenes-api
server.port=${PORT:8080}

# Base H2 embarquee (fichier) : zero configuration, sauvegarde = copier le dossier data/
spring.datasource.url=jdbc:h2:file:${APP_DATA_DIR:./data}/leschenes;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Compte administrateur du backoffice (/bo). En prod : variables d'environnement
# ADMIN_EMAIL et ADMIN_PASSWORD (ne JAMAIS mettre le vrai mot de passe dans le depot)
app.admin.email=${ADMIN_EMAIL:admin@leschenesdelaven.fr}
app.admin.password=${ADMIN_PASSWORD:change-me}

# Dossier contenant le build Angular (dist) servi en statique par Spring
app.frontend-dir=${FRONTEND_DIR:../frontend/dist/frontend/browser}
spring.web.resources.static-locations=classpath:/static/,file:${app.frontend-dir}/
# no-cache : le navigateur revalide toujours index.html (les bundles Angular sont hashés dans leur nom,
# donc immutables ; en prod, Nginx pourra remettre un cache long sur /assets/ et les chunk-*.js)
spring.web.resources.cache.cachecontrol.no-cache=true

# CORS : autorise le serveur de dev Angular (ng serve) en local ; en prod tout est same-origin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,capacitor://localhost,https://localhost}

# Envoi de mails (page contact) : optionnel. Si SMTP_HOST est vide, les messages
# sont juste enregistres en base (table messages) et le front fait un fallback mailto.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:contact@leschenesdelaven.fr}
app.mail.to=${MAIL_TO:contact@leschenesdelaven.fr}
