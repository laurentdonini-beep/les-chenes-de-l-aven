name: Build APK Android (backoffice)

# Construit l'APK debug de l'app Capacitor sur une machine Linux propre (GitHub Actions),
# pour les PC où un antivirus/WDAC d'entreprise bloque esbuild/aapt2.
# L'APK est ensuite téléchargeable dans l'onglet Actions (artefact "app-debug-apk").

on:
  workflow_dispatch:
  push:
    branches: [vibe/angular-spring-35f94a]
    paths:
      - 'v2/frontend/src/**'
      - 'v2/frontend/public/**'
      - 'v2/frontend/package.json'
      - 'v2/frontend/package-lock.json'
      - 'v2/frontend/angular.json'
      - 'v2/frontend/capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: npm ci (frontend)
        working-directory: v2/frontend
        run: npm ci

      - name: Build front Angular (configuration capacitor)
        working-directory: v2/frontend
        run: npx ng build --configuration capacitor

      - name: cap add android + cap sync
        working-directory: v2/frontend
        run: |
          npx cap add android
          npx cap sync android

      - name: Composants SDK Android (platform 36, build-tools 36)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          command -v sdkmanager || { echo "sdkmanager introuvable"; ls "$ANDROID_SDK_ROOT/cmdline-tools"; exit 1; }
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle assembleDebug
        working-directory: v2/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: v2/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
