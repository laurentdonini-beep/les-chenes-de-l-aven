backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

site_url: https://www.leschenesdelaven.com

collections:
  - name: "parametres"
    label: "Paramètres du site"
    files:
      - name: "site"
        label: "Coordonnées, tarifs & horaires"
        file: "src/_data/site.json"
        format: json
        fields:
          - { label: "Nom du site", name: "nom", widget: "string" }
          - { label: "Accroche", name: "baseline", widget: "string" }
          - { label: "Hôtes", name: "hote", widget: "string" }
          - { label: "Adresse (une ligne)", name: "adresse", widget: "string" }
          - { label: "Téléphone (affiché)", name: "tel", widget: "string" }
          - { label: "Téléphone (lien, ex: +336...)", name: "telHref", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Période d'ouverture", name: "ouverture", widget: "string" }
          - { label: "Tarif 1 personne", name: "tarif1", widget: "string" }
          - { label: "Tarif 2 personnes", name: "tarif2", widget: "string" }
          - { label: "Note tarifs", name: "tarifNote", widget: "text" }
          - { label: "Modalités de paiement", name: "paiement", widget: "text" }
          - { label: "Texte spa", name: "spa", widget: "text" }

  - name: "chambres"
    label: "Chambres"
    folder: "src/_chambres"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Mise en page", name: "layout", widget: "hidden", default: "chambre.njk" }
      - { label: "Ordre d'affichage", name: "ordre", widget: "number", default: 10 }
      - { label: "Nom de la chambre", name: "title", widget: "string" }
      - { label: "Surface", name: "surface", widget: "string" }
      - { label: "Capacité", name: "capacite", widget: "string" }
      - { label: "Résumé (carte)", name: "resume", widget: "text" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Équipements", name: "equipements", widget: "list", field: { label: "Équipement", name: "item", widget: "string" } }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages du site"
    files:
      - { label: "Accueil", name: "accueil", file: "src/index.md", fields:
          [ { label: "Mise en page", name: "layout", widget: "hidden", default: "base.njk" },
            { label: "Titre", name: "title", widget: "string" },
            { label: "Description SEO", name: "description", widget: "text" },
            { label: "Contenu", name: "body", widget: "markdown" } ] }
      - { label: "La maison", name: "maison", file: "src/la-maison.md", fields:
          [ { label: "Mise en page", name: "layout", widget: "hidden", default: "base.njk" },
            { label: "Titre", name: "title", widget: "string" },
            { label: "Description SEO", name: "description", widget: "text" },
            { label: "Contenu", name: "body", widget: "markdown" } ] }
      - { label: "Spa & bien-être", name: "spa", file: "src/spa.md", fields:
          [ { label: "Mise en page", name: "layout", widget: "hidden", default: "base.njk" },
            { label: "Titre", name: "title", widget: "string" },
            { label: "Description SEO", name: "description", widget: "text" },
            { label: "Contenu", name: "body", widget: "markdown" } ] }
      - { label: "Activités & accès", name: "activites", file: "src/activites.md", fields:
          [ { label: "Mise en page", name: "layout", widget: "hidden", default: "base.njk" },
            { label: "Titre", name: "title", widget: "string" },
            { label: "Description SEO", name: "description", widget: "text" },
            { label: "Contenu", name: "body", widget: "markdown" } ] }
      - { label: "Galerie", name: "galerie", file: "src/galerie.md", fields:
          [ { label: "Mise en page", name: "layout", widget: "hidden", default: "base.njk" },
            { label: "Titre", name: "title", widget: "string" },
            { label: "Description SEO", name: "description", widget: "text" },
            { label: "Contenu", name: "body", widget: "markdown" } ] }
      - { label: "Contact & réservation", name: "contact", file: "src/contact.md", fields:
          [ { label: "Mise en page", name: "layout", widget: "hidden", default: "base.njk" },
            { label: "Titre", name: "title", widget: "string" },
            { label: "Description SEO", name: "description", widget: "text" },
            { label: "Contenu", name: "body", widget: "markdown" } ] }
